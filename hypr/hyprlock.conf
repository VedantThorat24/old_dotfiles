background {
    monitor =
    path = /home/dusty/Pictures/fuji.jpg
    blur_passes = 3
    blur_size = 6
}

general {
    hide_cursor = true
}

input-field {
    monitor =
    
    size = 260, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2

    outer_color = rgb(6c9bd2)
    inner_color = rgb(071426)
    font_color = rgb(e8eef2)

    fade_on_empty = false
    rounding = 18

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    
    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = rgb(e8eef2)

    font_size = 72
    font_family = Rubik

    position = 0, 80

    halign = center
    valign = center
}